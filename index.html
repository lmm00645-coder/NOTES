<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>我的手帳</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#111;--sub:#8a8a8e;--line:rgba(60,60,67,.14);--fill:rgba(118,118,128,.12);--acc:#007aff;--red:#ff3b30;--glass:rgba(249,249,251,.82);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--sub:#98989f;--line:rgba(84,84,88,.5);--fill:rgba(118,118,128,.28);--acc:#0a84ff;--red:#ff453a;--glass:rgba(28,28,30,.85)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--sub:#98989f;--line:rgba(84,84,88,.5);--fill:rgba(118,118,128,.28);--acc:#0a84ff;--red:#ff453a;--glass:rgba(28,28,30,.85)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang HK","PingFang TC","Noto Sans TC",sans-serif;touch-action:pan-y;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{border:0;background:none;cursor:pointer}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:6px 16px 120px}
h1{margin:14px 2px 0;font-size:34px;font-weight:800;letter-spacing:.3px}
.sub{margin:0 2px 16px;color:var(--sub);font-size:15px}
.sec{margin:22px 4px 8px;font-size:13px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:20px;overflow:hidden}
.up{display:flex;align-items:center;gap:14px;width:100%;padding:18px;text-align:left}
.up .ico{width:48px;height:48px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center}
.up .ico svg{width:26px;height:26px}
.up b{display:block;font-size:17px}.up span{color:var(--sub);font-size:14px}
.thumb{position:relative;display:block;width:100%;background:var(--fill);max-height:260px;overflow:hidden}
.thumb img{display:block;width:100%;max-height:260px;object-fit:contain}
.thumb em{position:absolute;right:10px;bottom:10px;font-style:normal;font-size:13px;color:#fff;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px 11px;border-radius:99px;display:flex;gap:5px;align-items:center}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:.5px solid var(--line)}
.acts button{padding:13px 0;color:var(--acc);font-size:15px;display:flex;gap:6px;justify-content:center;align-items:center}
.acts button+button{border-left:.5px solid var(--line)}
.acts .r{color:var(--red)}
.cal{padding:12px 10px 10px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px}
.mh b{font-size:19px}
.mh div{display:flex;gap:4px}
.nv{width:36px;height:36px;border-radius:50%;color:var(--acc);display:grid;place-items:center}
.nv:active{background:var(--fill)}
.td{font-size:15px;color:var(--acc);padding:0 10px}
.g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.g .wd{font-size:12px;color:var(--sub);padding:4px 0}
.dy{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;gap:2px}
.dy .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;transition:background .15s}
.dy.sun .n{color:var(--red)}
.dy.out{visibility:hidden}
.dy.now .n{color:var(--acc);font-weight:700}
.dy.sel .n{background:var(--acc);color:#fff;font-weight:700}
.dy.sel.now .n{background:var(--acc);color:#fff}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:10px}
.seg button{padding:6px 0;border-radius:7px;font-size:13.5px;font-weight:600;transition:.15s}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;background:var(--card);position:relative}
.item+.item:before{content:"";position:absolute;top:0;left:50px;right:0;height:.5px;background:var(--line)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:#fff;flex:none;margin-top:1px}
.ck svg{width:15px;height:15px;stroke-width:3;opacity:0}
.item.done .ck{background:var(--c)}.item.done .ck svg{opacity:1}
.item.done .t{text-decoration:line-through;color:var(--sub)}
.bd{flex:1;min-width:0}
.t{font-size:17px;font-weight:600;word-break:break-word}
.m{font-size:13px;color:var(--sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.m .tg{color:var(--c);font-weight:600}.m .hi{color:var(--red);font-weight:600}
.nt{font-size:14px;color:var(--sub);margin-top:3px;white-space:pre-wrap;word-break:break-word}
.del{color:var(--sub);padding:3px}
.empty{padding:30px 16px;text-align:center;color:var(--sub);background:var(--card)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(22px + env(safe-area-inset-bottom,0px));height:54px;padding:0 22px;border-radius:27px;background:var(--acc);color:#fff;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 8px 24px rgba(0,122,255,.4);z-index:20;transition:transform .15s}
.fab:active{transform:scale(.94)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow:auto}
.sheet.on{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px}
.sh b{font-size:17px}.sh button{color:var(--acc);font-size:17px}.sh .sv{font-weight:700}
.fld{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden}
.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;min-height:46px}
.fr+.fr{border-top:.5px solid var(--line)}
.fr label{color:var(--ink)}
input[type=text],input[type=time],textarea{font-size:16px;background:transparent;border:0;outline:0;padding:0}
input[type=text]{width:100%}
input[type=time]{background:var(--fill);border-radius:8px;padding:6px 10px}
textarea{width:100%;height:56px;resize:none;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
.chip{position:relative}.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:flex;gap:6px;align-items:center;padding:7px 12px;border-radius:99px;background:var(--fill);font-size:14.5px;font-weight:600}
.chip span:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip input:checked+span{background:var(--c);color:#fff}
.chip input:checked+span:before{background:#fff}
.pseg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:9px;padding:2px;width:170px}
.pseg label{position:relative;text-align:center}.pseg input{position:absolute;opacity:0;inset:0}
.pseg span{display:block;padding:5px 0;border-radius:7px;font-size:14px;font-weight:600}
.pseg input:checked+span{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.modal{position:fixed;inset:0;z-index:60;display:none}.modal.on{display:block}
#viewer{background:#000}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;display:grid;place-items:center}
#vimg{max-width:100%;max-height:100%;-webkit-user-drag:none;transform-origin:center;will-change:transform}
.vb{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px;color:#fff;z-index:2;pointer-events:none}
.vb>*{pointer-events:auto}
.vb.top{top:0;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 20px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.vb.bot{bottom:0;padding:20px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.65))}
.vbtn{min-width:46px;height:46px;border-radius:23px;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;display:flex;gap:6px;align-items:center;justify-content:center;padding:0 14px;font-size:15px}
.vbtn:active{background:rgba(255,255,255,.35)}
.al{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(0,0,0,.4);padding:30px}
.al.on{display:grid}
.al .bx{background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:16px;width:100%;max-width:290px;text-align:center;overflow:hidden}
.al h3{margin:0;padding:18px 16px 4px;font-size:17px}.al p{margin:0;padding:0 16px 16px;font-size:14px;color:var(--sub)}
.al .bt{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--line)}
.al .bt button{padding:13px 0;font-size:17px;color:var(--acc)}
.al .bt button+button{border-left:.5px solid var(--line);font-weight:700;color:var(--red)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-80px);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:10px 18px;border-radius:99px;font-weight:600;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:90;transition:transform .3s;pointer-events:none}
.toast.on{transform:translate(-50%,0)}
:root{--gc:255,255,255;--ga:.46;--ge:rgba(255,255,255,.7);--eh:rgba(255,255,255,.9);--el:rgba(255,255,255,.3);--bo:.9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gc:70,76,110;--ge:rgba(255,255,255,.18);--eh:rgba(255,255,255,.3);--el:rgba(255,255,255,.06);--bo:.55}}
:root[data-theme="dark"]{--gc:70,76,110;--ge:rgba(255,255,255,.18);--eh:rgba(255,255,255,.3);--el:rgba(255,255,255,.06);--bo:.55}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;opacity:var(--bo);background:radial-gradient(40% 30% at 15% 10%,#5ac8fa,transparent 70%),radial-gradient(45% 35% at 90% 25%,#ff9ec7,transparent 70%),radial-gradient(50% 40% at 20% 75%,#a28bff,transparent 70%),radial-gradient(45% 35% at 85% 90%,#ffd27a,transparent 70%)}
.card,.fld{position:relative;background:linear-gradient(145deg,rgba(var(--gc),calc(var(--ga) + .18)),rgba(var(--gc),var(--ga)) 45%,rgba(var(--gc),calc(var(--ga) * .6)));-webkit-backdrop-filter:blur(28px) saturate(190%) brightness(1.04);backdrop-filter:blur(28px) saturate(190%) brightness(1.04);border:1px solid var(--ge);box-shadow:inset 0 1.5px 0 var(--eh),inset 0 -1px 1px var(--el),0 12px 32px rgba(30,40,120,.16)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;opacity:.35;background:radial-gradient(120% 55% at 20% -10%,rgba(255,255,255,.6),transparent 55%)}
.item,.empty{background:transparent}
.seg{background:rgba(var(--gc),calc(var(--ga) * .5));border:1px solid var(--ge);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.dy.sel .n{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px rgba(0,122,255,.4)}
.sheet{background:linear-gradient(160deg,rgba(var(--gc),calc(var(--ga) + .32)),rgba(var(--gc),calc(var(--ga) + .15)));-webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%);border:1px solid var(--ge);border-bottom:0;box-shadow:inset 0 1.5px 0 var(--eh),0 -10px 40px rgba(0,0,0,.18)}
.fab{background:linear-gradient(145deg,rgba(0,122,255,.88),rgba(64,156,255,.62));-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(255,255,255,.2),0 10px 28px rgba(0,122,255,.4)}
.al .bx,.toast{background:rgba(var(--gc),calc(var(--ga) + .3));border:1px solid var(--ge);box-shadow:inset 0 1px 0 var(--eh),0 10px 40px rgba(0,0,0,.2)}
.gl{display:flex;align-items:center;gap:12px;padding:14px 16px}.gl input{flex:1;accent-color:var(--acc);touch-action:pan-x}.gl b{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.hd{display:flex;align-items:flex-start;justify-content:space-between}
.gear{width:42px;height:42px;margin:16px 2px 0 0;border-radius:50%;display:grid;place-items:center;color:var(--acc);background:rgba(var(--gc),calc(var(--ga) + .2));border:1px solid var(--ge);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 var(--eh)}
.gear svg{width:22px;height:22px}
.pseg{grid-template-columns:repeat(4,1fr);width:216px}
.lk{color:var(--acc);font-size:15px;font-weight:600}.lk.rd{color:var(--red)}
.gh{font-size:13px;color:var(--sub);font-weight:600;margin:6px 4px}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.bgs button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 4px 8px;border-radius:14px;border:2px solid transparent}
.bgs button.on{border-color:var(--acc)}
.bgs i{width:100%;height:54px;border-radius:10px;display:block;border:1px solid var(--line);background-size:cover;background-position:center}
.p1{background:radial-gradient(70% 70% at 15% 15%,#5ac8fa,transparent),radial-gradient(70% 70% at 90% 30%,#ff9ec7,transparent),radial-gradient(70% 70% at 30% 100%,#a28bff,transparent),#ffd27a}
.p2{background:linear-gradient(135deg,#fff,#9a9aa0 55%,#3a3a3e)}
.p3{background-color:var(--fill)}
input[type=date]{font-size:16px;background:var(--fill);border:0;outline:0;border-radius:8px;padding:6px 10px;min-height:34px}
:root[data-bg="mono"] body::before{background:radial-gradient(45% 35% at 15% 10%,#fff,transparent 70%),radial-gradient(45% 35% at 90% 30%,#9a9aa0,transparent 70%),radial-gradient(50% 40% at 20% 80%,#5c5c62,transparent 70%),radial-gradient(45% 35% at 85% 92%,#d4d4d8,transparent 70%)}
:root[data-bg="photo"] body::before{inset:0;opacity:1;background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.1)),var(--bgimg) center/cover no-repeat}
.dayi{display:flex;align-items:center;gap:14px;padding:13px 14px;position:relative}
.dayi+.dayi:before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--line)}
.dn{min-width:52px;text-align:center;line-height:1.1;color:#ff9500}
.dn b{display:block;font-size:26px;font-weight:800}.dn small{font-size:12px;color:var(--sub)}
.dayi.past{opacity:.55}.dayi.past .dn{color:var(--sub)}
.dy.imp .n{box-shadow:inset 0 0 0 2px #ff9500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><h1 id="date"></h1><button class="gear" id="gear" aria-label="設定"><svg class="i" data-i="gear"></svg></button></div>
  <p class="sub" id="week"></p>

  <div class="sec">課程表</div>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="card" id="tt"></div>

  <div class="sec">月曆</div>
  <div class="card cal">
    <div class="mh"><b id="mt"></b><div><button class="td" id="today">今天</button><button class="nv" id="prev" aria-label="上個月"><svg class="i" data-i="l"></svg></button><button class="nv" id="next" aria-label="下個月"><svg class="i" data-i="r"></svg></button></div></div>
    <div class="g" id="grid"></div>
  </div>

  <div class="sec"><span id="dl"></span><span id="cnt"></span></div>
  <div class="seg" id="tabs"><button data-f="all" class="on">全部</button><button data-f="pending">未完成</button><button data-f="done">已完成</button></div>
  <div class="card" id="list"></div>

  <div class="sec"><span>重要日子</span><button class="lk" id="addDay">＋ 新增</button></div>
  <div class="card" id="days"></div>
</div>

<button class="fab" id="fab"><svg class="i" data-i="add"></svg>新增事項</button>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet">
  <div class="sh"><button id="sc">取消</button><b id="stt">新增事項</b><button class="sv" id="sv">加入</button></div>
  <div class="fld"><div class="fr"><input type="text" id="title" maxlength="60" placeholder="事項名稱，例如：數學作業" autocomplete="off"></div></div>
  <div class="fld">
    <div class="fr"><label for="tm">時間</label><input type="time" id="tm"></div>
    <div class="fr"><label>優先程度</label><div class="pseg"><label><input type="radio" name="p" value="n" checked><span>無</span></label><label><input type="radio" name="p" value="h"><span>高</span></label><label><input type="radio" name="p" value="m"><span>中</span></label><label><input type="radio" name="p" value="l"><span>低</span></label></div></div>
  </div>
  <div class="fld"><div class="chips" id="tags"></div></div>
  <div class="fld"><div class="fr"><textarea id="note" placeholder="提醒備註（選填）"></textarea></div></div>
</div>

<input type="file" id="bgfile" accept="image/*" hidden>
<div class="sheet" id="set">
  <div class="sh"><span></span><b>設定</b><button class="sv" id="setx">完成</button></div>
  <div class="gh">背景</div>
  <div class="fld"><div class="bgs" id="bgs"><button data-b="color"><i class="p1"></i>原始色彩</button><button data-b="mono"><i class="p2"></i>黑白玻璃</button><button data-b="photo"><i class="p3"></i>自選照片</button></div>
  <div class="fr"><button class="lk" id="bgpick">從相簿選擇照片</button><button class="lk rd" id="bgdel">移除照片</button></div></div>
  <div class="gh">玻璃</div>
  <div class="fld"><div class="gl"><span>玻璃透明度</span><input type="range" id="gr" min="0" max="1" step="0.01" aria-label="玻璃透明度"><b id="gv"></b></div></div>
</div>
<div class="sheet" id="ds">
  <div class="sh"><button id="dc">取消</button><b>新增重要日子</b><button class="sv" id="dsv">加入</button></div>
  <div class="fld"><div class="fr"><input type="text" id="dname" maxlength="30" placeholder="名稱，例如：期末考、生日、旅行" autocomplete="off"></div><div class="fr"><label for="ddate">日期</label><input type="date" id="ddate"></div></div>
</div>
<div class="modal" id="viewer">
  <div class="vb top"><button class="vbtn" id="vc"><svg class="i" data-i="x"></svg>關閉</button><span id="zl">100%</span><button class="vbtn" id="vr"><svg class="i" data-i="img"></svg>更換</button></div>
  <div id="stage"><img id="vimg" alt="課程表" draggable="false"></div>
  <div class="vb bot">
    <button class="vbtn" id="zo" aria-label="縮小"><svg class="i" data-i="min"></svg></button>
    <button class="vbtn" id="zi" aria-label="放大"><svg class="i" data-i="max"></svg></button>
    <button class="vbtn" id="rot" aria-label="旋轉"><svg class="i" data-i="rot"></svg></button>
    <button class="vbtn" id="rst">重設</button>
    <button class="vbtn" id="vd" aria-label="刪除"><svg class="i" data-i="trash"></svg></button>
  </div>
</div>

<div class="al" id="al"><div class="bx"><h3 id="at"></h3><p id="ap"></p><div class="bt"><button id="an">取消</button><button id="ay">刪除</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var P={l:'<path d="m15 18-6-6 6-6"/>',r:'<path d="m9 18 6-6-6-6"/>',add:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',img:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',min:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M8 11h6"/>',max:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/>',rot:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',zoom:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',ck:'<path d="M20 6 9 17l-5-5"/>',gear:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'};
function ic(n){return '<svg class="i" viewBox="0 0 24 24">'+P[n]+'</svg>'}
document.querySelectorAll('svg[data-i]').forEach(function(s){s.setAttribute('viewBox','0 0 24 24');s.innerHTML=P[s.dataset.i]});
var $=function(i){return document.getElementById(i)};
var W=['日','一','二','三','四','五','六'];
function two(n){return n<10?'0'+n:''+n}
function dk(d){return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function head(){var n=new Date();$('date').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';$('week').textContent='星期'+W[n.getDay()]}
head();

/* 鎖定頁面縮放（只有課程表全螢幕內可縮放） */
['gesturestart','gesturechange','gestureend'].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault()},{passive:false})});
document.addEventListener('touchmove',function(e){if(e.touches.length>1&&!e.target.closest('#stage'))e.preventDefault()},{passive:false});
var lt=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-lt<300&&!e.target.closest('#stage,input,textarea'))e.preventDefault();lt=n},{passive:false});

var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1700)}
var yes=null;
function ask(a,b,fn){$('at').textContent=a;$('ap').textContent=b;yes=fn;$('al').classList.add('on')}
$('an').onclick=function(){$('al').classList.remove('on');yes=null};
$('ay').onclick=function(){$('al').classList.remove('on');var f=yes;yes=null;if(f)f()};

/* IndexedDB */
var dbp=new Promise(function(res,rej){try{var r=indexedDB.open('planner-db',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}});
function idb(m,fn){return dbp.then(function(db){return new Promise(function(res,rej){var tx=db.transaction('kv',m),q=fn(tx.objectStore('kv'));tx.oncomplete=function(){res(q&&q.result)};tx.onerror=function(){rej(tx.error)}})})}
var url=null;
function showTT(b){
  if(url){URL.revokeObjectURL(url);url=null}
  var el=$('tt');
  if(!b){el.innerHTML='<button class="up" id="up"><span class="ico">'+ic('cam')+'</span><span><b>上傳課程表</b><span>拍照或從相簿選取</span></span></button>';$('up').onclick=pick;return}
  url=URL.createObjectURL(b);
  el.innerHTML='<button class="thumb" id="th"><img src="'+url+'" alt="課程表"><em>'+ic('zoom')+'全螢幕查看</em></button><div class="acts"><button id="op">'+ic('zoom')+'放大查看</button><button id="rp">'+ic('img')+'更換</button><button class="r" id="rm">'+ic('trash')+'刪除</button></div>';
  $('th').onclick=$('op').onclick=openV;$('rp').onclick=pick;$('rm').onclick=delTT}
function pick(){$('file').value='';$('file').click()}
$('file').onchange=function(){var f=this.files&&this.files[0];if(!f)return;
  idb('readwrite',function(s){return s.put(f,'timetable')}).then(function(){showTT(f);if($('viewer').classList.contains('on')){$('vimg').src=url;resetV()}toast('課程表已儲存')}).catch(function(){toast('儲存失敗，請再試一次')})};
function delTT(){ask('刪除課程表？','刪除後需要重新上傳相片。',function(){idb('readwrite',function(s){return s.delete('timetable')}).then(function(){closeV();showTT(null);toast('已刪除課程表')})})}
idb('readonly',function(s){return s.get('timetable')}).then(showTT).catch(function(){showTT(null)});

/* 全螢幕查看 */
var v={x:0,y:0,s:1,r:0},st=$('stage'),im=$('vimg'),ptr=new Map(),last=null;
function apply(){im.style.transform='translate('+v.x+'px,'+v.y+'px) scale('+v.s+') rotate('+v.r+'deg)';$('zl').textContent=Math.round(v.s*100)+'%'}
function resetV(){v={x:0,y:0,s:1,r:0};apply()}
function zoomAt(f,px,py){var ns=Math.min(10,Math.max(.5,v.s*f));f=ns/v.s;var b=st.getBoundingClientRect(),cx=px-b.left-b.width/2,cy=py-b.top-b.height/2;v.x=cx-(cx-v.x)*f;v.y=cy-(cy-v.y)*f;v.s=ns;apply()}
function ctr(){var b=st.getBoundingClientRect();return[b.left+b.width/2,b.top+b.height/2]}
function openV(){im.src=url;resetV();$('viewer').classList.add('on');document.body.style.overflow='hidden'}
function closeV(){$('viewer').classList.remove('on');document.body.style.overflow=''}
$('vc').onclick=closeV;$('vr').onclick=pick;$('vd').onclick=delTT;
$('zi').onclick=function(){var c=ctr();zoomAt(1.4,c[0],c[1])};
$('zo').onclick=function(){var c=ctr();zoomAt(1/1.4,c[0],c[1])};
$('rot').onclick=function(){v.r=(v.r+90)%360;apply()};$('rst').onclick=resetV;
st.addEventListener('wheel',function(e){e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
st.addEventListener('dblclick',function(e){if(v.s>1.05)resetV();else zoomAt(2.5,e.clientX,e.clientY)});
function pi(){var a=Array.from(ptr.values());return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}
st.addEventListener('pointerdown',function(e){st.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});last=ptr.size===2?pi():null});
st.addEventListener('pointermove',function(e){if(!ptr.has(e.pointerId))return;var o=ptr.get(e.pointerId),dx=e.clientX-o.x,dy=e.clientY-o.y;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===1){v.x+=dx;v.y+=dy;apply()}else if(ptr.size===2){var p=pi();if(last){v.x+=p.x-last.x;v.y+=p.y-last.y;zoomAt(p.d/last.d,p.x,p.y)}last=p}});
function up(e){ptr.delete(e.pointerId);last=ptr.size===2?pi():null}
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);

/* 資料 */
var TAGS=[{id:'hw',n:'功課作業',c:'#007aff'},{id:'ex',n:'考試測驗',c:'#ff3b30'},{id:'me',n:'個人行程',c:'#30b0c7'},{id:'td',n:'待辦事項',c:'#ff9500'}];
var PN={h:'高',m:'中',l:'低'};
$('tags').innerHTML=TAGS.map(function(t,i){return '<label class="chip" style="--c:'+t.c+'"><input type="radio" name="tag" value="'+t.id+'"'+(i?'':' checked')+'><span>'+t.n+'</span></label>'}).join('');
var tasks=[];try{tasks=JSON.parse(localStorage.getItem('planner-tasks')||'[]')}catch(e){}
function save(){try{localStorage.setItem('planner-tasks',JSON.stringify(tasks))}catch(e){toast('無法儲存資料')}}
function tg(id){return TAGS.filter(function(x){return x.id===id})[0]||TAGS[0]}
var now=new Date(),sel=dk(now),cy=now.getFullYear(),cm=now.getMonth(),filter='all';

/* 月曆 */
function drawCal(){
  $('mt').textContent=cy+'年'+(cm+1)+'月';
  var first=new Date(cy,cm,1).getDay(),days=new Date(cy,cm+1,0).getDate(),today=dk(new Date()),by={};
  tasks.forEach(function(t){var k=t.when.slice(0,10);(by[k]=by[k]||[]).push(t)});
  var h=W.map(function(w){return '<div class="wd">'+w+'</div>'}).join('');
  for(var i=0;i<first;i++)h+='<div class="dy out"></div>';
  for(var d=1;d<=days;d++){
    var k=cy+'-'+two(cm+1)+'-'+two(d),a=(by[k]||[]).filter(function(t){return!t.done}),seen=[],dots='';
    a.forEach(function(t){if(seen.indexOf(t.tag)<0&&seen.length<3){seen.push(t.tag);dots+='<i style="--c:'+tg(t.tag).c+'"></i>'}});
    if(!a.length&&(by[k]||[]).length)dots='<i style="--c:var(--sub);opacity:.4"></i>';
    h+='<button class="dy'+((first+d-1)%7===0?' sun':'')+(k===today?' now':'')+(k===sel?' sel':'')+(impSet[k]?' imp':'')+'" data-k="'+k+'"><span class="n">'+d+'</span><span class="dots">'+dots+'</span></button>'}
  $('grid').innerHTML=h}
$('grid').onclick=function(e){var b=e.target.closest('.dy[data-k]');if(!b)return;sel=b.dataset.k;render()};
$('prev').onclick=function(){cm--;if(cm<0){cm=11;cy--}drawCal()};
$('next').onclick=function(){cm++;if(cm>11){cm=0;cy++}drawCal()};
$('today').onclick=function(){var n=new Date();cy=n.getFullYear();cm=n.getMonth();sel=dk(n);render()};

/* 當天清單 */
function render(){
  var p=sel.split('-'),d=new Date(+p[0],p[1]-1,+p[2]),t0=dk(new Date());
  $('dl').textContent=(sel===t0?'今天 · ':'')+(+p[1])+'月'+(+p[2])+'日 星期'+W[d.getDay()]+(impSet[sel]?' · 重要：'+impSet[sel]:'');
  var all=tasks.filter(function(t){return t.when.slice(0,10)===sel}).sort(function(a,b){return a.when<b.when?-1:1});
  $('cnt').textContent=all.length?all.filter(function(t){return!t.done}).length+' 項未完成':'';
  var l=all.filter(function(t){return filter==='all'||(filter==='done')===t.done});
  if(!l.length)$('list').innerHTML='<div class="empty">'+(all.length?'沒有符合的事項':'這天沒有事項，按「新增事項」記錄吧')+'</div>';
  else $('list').innerHTML=l.map(function(t){var g=tg(t.tag);
    return '<div class="item'+(t.done?' done':'')+'" style="--c:'+g.c+'"><button class="ck" data-a="t" data-id="'+t.id+'" aria-label="切換完成狀態">'+ic('ck')+'</button><div class="bd"><div class="t">'+esc(t.title)+'</div><div class="m"><span>'+t.when.slice(11,16)+'</span><span class="tg">'+g.n+'</span>'+(t.p==='h'?'<span class="hi">高優先</span>':t.p==='m'?'<span>中優先</span>':t.p==='l'?'<span>低優先</span>':'')+'</div>'+(t.note?'<div class="nt">'+esc(t.note)+'</div>':'')+'</div><button class="del" data-a="d" data-id="'+t.id+'" aria-label="刪除">'+ic('trash')+'</button></div>'}).join('');
  drawCal()}
$('tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;filter=b.dataset.f;Array.prototype.forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});render()};
$('list').onclick=function(e){var b=e.target.closest('button[data-a]');if(!b)return;var id=b.dataset.id;
  if(b.dataset.a==='t'){tasks.forEach(function(t){if(t.id===id)t.done=!t.done});save();render()}
  else ask('刪除這個事項？','刪除後無法復原。',function(){tasks=tasks.filter(function(t){return t.id!==id});save();render();toast('已刪除')})};

/* 新增表單 */
function sheet(on){$('sheet').classList.toggle('on',on);$('ov').classList.toggle('on',on);if(on)setTimeout(function(){$('title').focus()},320)}
$('fab').onclick=function(){var n=new Date();$('tm').value=sel===dk(n)?two((n.getHours()+1)%24)+':00':'09:00';var p=sel.split('-');$('stt').textContent=(+p[1])+'月'+(+p[2])+'日';sheet(true)};
$('sc').onclick=$('ov').onclick=function(){sheet(false);document.activeElement&&document.activeElement.blur()};
$('sv').onclick=function(){var t=$('title').value.trim();if(!t){toast('請輸入事項名稱');$('title').focus();return}
  tasks.push({id:Date.now()+''+Math.floor(Math.random()*999),when:sel+'T'+($('tm').value||'09:00'),title:t,tag:document.querySelector('input[name=tag]:checked').value,p:document.querySelector('input[name=p]:checked').value,note:$('note').value.trim(),done:false});
  save();$('title').value='';$('note').value='';sheet(false);render();toast('已加入備忘錄')};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('viewer').classList.contains('on'))closeV();else sheet(false)}});
var gt=.55;try{var gs=localStorage.getItem('planner-glass');if(gs!==null&&!isNaN(+gs))gt=+gs}catch(e){}
function setG(t){document.documentElement.style.setProperty('--ga',(0.9-t*0.8).toFixed(3));$('gv').textContent=Math.round(t*100)+'%'}
$('gr').value=gt;setG(gt);
$('gr').oninput=function(){setG(+this.value);try{localStorage.setItem('planner-glass',this.value)}catch(e){}};

/* 設定：背景 */
var bgmode='color',bgURL=null;
try{bgmode=localStorage.getItem('planner-bg')||'color'}catch(e){}
function setBgBlob(b){if(bgURL)URL.revokeObjectURL(bgURL);bgURL=b?URL.createObjectURL(b):null}
function applyBg(){
  var m=bgmode==='photo'&&bgURL?'photo':bgmode==='mono'?'mono':'color',R=document.documentElement;
  R.dataset.bg=m;
  if(bgURL)R.style.setProperty('--bgimg','url("'+bgURL+'")');
  Array.prototype.forEach.call($('bgs').children,function(b){b.classList.toggle('on',b.dataset.b===m)});
  $('bgdel').style.display=bgURL?'':'none';
  document.querySelector('.p3').style.backgroundImage=bgURL?'url("'+bgURL+'")':''}
function setBgMode(m){bgmode=m;try{localStorage.setItem('planner-bg',m)}catch(x){}applyBg()}
function pickBg(){$('bgfile').value='';$('bgfile').click()}
$('bgs').onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.b==='photo'&&!bgURL){pickBg();return}setBgMode(b.dataset.b)};
$('bgpick').onclick=pickBg;
$('bgfile').onchange=function(){var f=this.files&&this.files[0];if(!f)return;
  idb('readwrite',function(s){return s.put(f,'bg')}).then(function(){setBgBlob(f);setBgMode('photo');toast('背景已更新')}).catch(function(){toast('儲存失敗，請再試一次')})};
$('bgdel').onclick=function(){idb('readwrite',function(s){return s.delete('bg')}).then(function(){setBgBlob(null);setBgMode('color');toast('已移除背景照片')})};
idb('readonly',function(s){return s.get('bg')}).then(function(b){if(b)setBgBlob(b);applyBg()}).catch(applyBg);
applyBg();
function setOpen(on){$('set').classList.toggle('on',on);$('ov').classList.toggle('on',on)}
$('gear').onclick=function(){setOpen(true)};$('setx').onclick=function(){setOpen(false)};
var _ov=$('ov').onclick;$('ov').onclick=function(){_ov();setOpen(false);dayS(false)};

/* 重要日子 */
var idays=[],impSet={};
try{idays=JSON.parse(localStorage.getItem('planner-days')||'[]')}catch(e){}
function saveD(){try{localStorage.setItem('planner-days',JSON.stringify(idays))}catch(e){toast('無法儲存資料')}}
function dd(k){var p=k.split('-'),n=new Date();return Math.round((new Date(+p[0],p[1]-1,+p[2])-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5)}
function drawDays(){
  impSet={};idays.forEach(function(x){impSet[x.date]=impSet[x.date]?impSet[x.date]+'、'+x.name:x.name});
  var l=idays.slice().sort(function(a,b){var da=dd(a.date),db=dd(b.date);return (da<0)-(db<0)||(da<0?db-da:da-db)});
  $('days').innerHTML=l.length?l.map(function(x){var n=dd(x.date),p=x.date.split('-');
    return '<div class="dayi'+(n<0?' past':'')+'"><div class="dn"><b>'+(n===0?'今天':Math.abs(n))+'</b><small>'+(n===0?'':n>0?'天後':'天前')+'</small></div><div class="bd"><div class="t">'+esc(x.name)+'</div><div class="m"><span>'+p[0]+'年'+(+p[1])+'月'+(+p[2])+'日</span></div></div><button class="del" data-id="'+x.id+'" aria-label="刪除">'+ic('trash')+'</button></div>'}).join(''):'<div class="empty">加入考試、生日、旅行等重要日子，這裡會顯示倒數</div>'}
$('days').onclick=function(e){var b=e.target.closest('button[data-id]');if(!b)return;var id=b.dataset.id;
  ask('刪除這個重要日子？','刪除後無法復原。',function(){idays=idays.filter(function(x){return x.id!==id});saveD();drawDays();drawCal();toast('已刪除')})};
function dayS(on){$('ds').classList.toggle('on',on);$('ov').classList.toggle('on',on);if(on)setTimeout(function(){$('dname').focus()},320)}
$('addDay').onclick=function(){$('ddate').value=sel;dayS(true)};
$('dc').onclick=function(){dayS(false)};
$('dsv').onclick=function(){var n=$('dname').value.trim(),d=$('ddate').value;if(!n){toast('請輸入名稱');$('dname').focus();return}if(!d){toast('請選擇日期');return}
  idays.push({id:Date.now()+''+Math.floor(Math.random()*999),name:n,date:d});saveD();$('dname').value='';dayS(false);drawDays();drawCal();toast('已加入重要日子')};
drawDays();
document.addEventListener('visibilitychange',function(){if(!document.hidden){head();render()}});
render();
})();
</script>
</body>
</html>
