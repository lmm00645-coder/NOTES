<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的每日手帳</title>
<style>
:root{--bg:#eef1f7;--card:rgba(255,255,255,.78);--solid:#fff;--ink:#1c2340;--sub:#6b7391;--line:rgba(28,35,64,.09);--acc:#3d5afe;--acc2:#e8ecff;--danger:#e5484d;--shadow:0 8px 30px rgba(40,50,100,.10);--glow1:#cfd9ff;--glow2:#d8f3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1324;--card:rgba(30,36,64,.72);--solid:#1b2140;--ink:#eaedfb;--sub:#9aa3c7;--line:rgba(255,255,255,.09);--acc:#7d92ff;--acc2:#252d58;--shadow:0 8px 30px rgba(0,0,0,.35);--glow1:#1d2a63;--glow2:#12333a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1324;--card:rgba(30,36,64,.72);--solid:#1b2140;--ink:#eaedfb;--sub:#9aa3c7;--line:rgba(255,255,255,.09);--acc:#7d92ff;--acc2:#252d58;--shadow:0 8px 30px rgba(0,0,0,.35);--glow1:#1d2a63;--glow2:#12333a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 "PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
background-image:radial-gradient(520px 320px at 90% -40px,var(--glow1),transparent 70%),radial-gradient(480px 300px at -10% 30%,var(--glow2),transparent 70%);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}
header{padding:10px 4px 18px}
header .d{font-size:27px;font-weight:800;letter-spacing:.5px;line-height:1.25}
header .w{color:var(--sub);margin-top:2px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{background:var(--acc2);color:var(--acc);padding:2px 12px;border-radius:99px;font-size:13px;font-weight:600}
.card{background:var(--card);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px;margin-bottom:18px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ch h2{margin:0;font-size:18px;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:14px;font-weight:600;background:var(--acc2);color:var(--acc);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.95)}
.btn.main{background:var(--acc);color:#fff}
.btn.danger{color:var(--danger);background:rgba(229,72,77,.12)}
.upload{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 16px;border:2px dashed var(--line);border-radius:20px;text-align:center;color:var(--sub)}
.upload .big{width:52px;height:52px;border-radius:18px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(61,90,254,.35)}
.upload .big svg{width:26px;height:26px}
.upload b{color:var(--ink);font-size:16px}
.thumb{position:relative;border-radius:18px;overflow:hidden;background:var(--solid);max-height:300px;display:grid;place-items:center;cursor:zoom-in}
.thumb img{width:100%;max-height:300px;object-fit:contain;display:block}
.thumb .hint{position:absolute;right:10px;bottom:10px;background:rgba(15,19,36,.65);color:#fff;border-radius:99px;padding:5px 12px;font-size:12.5px;display:flex;gap:5px;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1;justify-content:center}
.f{display:grid;gap:12px}
label.l{font-size:13px;color:var(--sub);font-weight:600;display:block;margin-bottom:5px}
input[type=text],input[type=datetime-local],textarea{width:100%;padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:var(--solid);outline:none;transition:border .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
textarea{resize:none;height:60px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--solid);font-size:13.5px;font-weight:600;transition:.15s}
.chip span:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--solid))}
.chip input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--acc2);border-radius:14px;padding:3px}
.seg label{position:relative;text-align:center}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;padding:7px 0;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--sub);transition:.15s}
.seg input:checked+span{background:var(--solid);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--acc2);border-radius:14px;padding:3px;margin-bottom:14px}
.tabs button{padding:8px 0;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--sub);transition:.15s}
.tabs button.on{background:var(--solid);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.day{font-size:13px;color:var(--sub);font-weight:700;margin:14px 0 6px 2px}
.day.today{color:var(--acc)}
.item{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:18px;background:var(--solid);border:1px solid var(--line);border-left:5px solid var(--c);margin-bottom:8px;transition:opacity .2s}
.item.done{opacity:.55}
.item.done .t{text-decoration:line-through}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--sub);display:grid;place-items:center;color:#fff;margin-top:1px;flex:none;transition:.15s}
.item.done .ck{background:var(--c);border-color:var(--c)}
.ck svg{width:14px;height:14px;stroke-width:3;opacity:0}
.item.done .ck svg{opacity:1}
.body{flex:1;min-width:0}
.t{font-weight:700;word-break:break-word}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12.5px;color:var(--sub)}
.tg{color:var(--c);font-weight:700}
.pr{padding:0 8px;border-radius:99px;background:rgba(229,72,77,.13);color:var(--danger);font-weight:700}
.pr.m{background:rgba(240,160,48,.16);color:#c77d12}.pr.l{background:var(--acc2);color:var(--sub)}
.od{color:var(--danger);font-weight:700}
.note{font-size:13px;color:var(--sub);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.del{color:var(--sub);padding:4px;border-radius:10px}
.del:active{color:var(--danger)}
.empty{text-align:center;color:var(--sub);padding:28px 0}
.modal{position:fixed;inset:0;z-index:50;display:none}
.modal.on{display:block}
#viewer{background:#05070f}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;display:grid;place-items:center}
#stage.drag{cursor:grabbing}
#vimg{max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none;will-change:transform;transform-origin:center}
.vbar{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;z-index:2}
.vbar.top{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px));background:linear-gradient(rgba(0,0,0,.6),transparent)}
.vbar.bot{bottom:0;justify-content:center;gap:8px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.65))}
.vb{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center}
.vb:active{background:rgba(255,255,255,.3)}
.vb.w{width:auto;border-radius:23px;padding:0 16px;font-size:14px;gap:6px;display:flex;align-items:center}
#zl{font-size:13px;min-width:44px;text-align:center}
.dlg{background:rgba(5,7,15,.5);display:none;place-items:center;padding:24px;z-index:60}
.dlg.on{display:grid}
.dlg .box{background:var(--solid);border-radius:22px;padding:22px;max-width:320px;width:100%;box-shadow:var(--shadow)}
.dlg h3{margin:0 0 6px;font-size:17px}.dlg p{margin:0 0 16px;color:var(--sub)}
.dlg .row{margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:70}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="d" id="date"></div>
    <div class="w"><span id="week"></span><span class="pill" id="sum"></span></div>
  </header>

  <section class="card">
    <div class="ch"><h2><svg class="i" id="ic-cal"></svg>主頁課程表</h2></div>
    <input type="file" id="file" accept="image/*" hidden>
    <div id="tt"></div>
  </section>

  <section class="card">
    <div class="ch"><h2><svg class="i" id="ic-plus"></svg>新增事項</h2></div>
    <div class="f">
      <div><label class="l" for="when">日期及時間</label><input type="datetime-local" id="when"></div>
      <div><label class="l" for="title">事項名稱</label><input type="text" id="title" maxlength="60" placeholder="例如：數學作業、通識測驗溫習、籃球訓練" autocomplete="off"></div>
      <div><label class="l">分類</label><div class="chips" id="tags"></div></div>
      <div><label class="l">優先程度</label>
        <div class="seg" id="prio">
          <label><input type="radio" name="p" value="h"><span>高</span></label>
          <label><input type="radio" name="p" value="m" checked><span>中</span></label>
          <label><input type="radio" name="p" value="l"><span>低</span></label>
        </div></div>
      <div><label class="l" for="note">提醒備註（選填）</label><textarea id="note" placeholder="例如：記得帶計算機、交到老師桌上"></textarea></div>
      <button class="btn main" id="add" style="justify-content:center;padding:13px"><svg class="i" id="ic-add"></svg>加入備忘錄</button>
    </div>
  </section>

  <section class="card">
    <div class="ch"><h2><svg class="i" id="ic-list"></svg>備忘錄時間表</h2></div>
    <div class="tabs" id="tabs">
      <button data-f="all" class="on">全部</button>
      <button data-f="pending">今日未完成</button>
      <button data-f="done">已完成</button>
    </div>
    <div id="list"></div>
  </section>
</div>

<div class="modal" id="viewer">
  <div class="vbar top">
    <button class="vb w" id="vclose"><svg class="i" id="ic-x"></svg>關閉</button>
    <span id="zl">100%</span>
    <button class="vb w" id="vrep"><svg class="i" id="ic-img"></svg>更換</button>
  </div>
  <div id="stage"><img id="vimg" alt="課程表" draggable="false"></div>
  <div class="vbar bot">
    <button class="vb" id="zo" aria-label="縮小"><svg class="i" id="ic-min"></svg></button>
    <button class="vb" id="zi" aria-label="放大"><svg class="i" id="ic-max"></svg></button>
    <button class="vb" id="rot" aria-label="旋轉"><svg class="i" id="ic-rot"></svg></button>
    <button class="vb w" id="rst"><svg class="i" id="ic-rst"></svg>重設</button>
    <button class="vb" id="vdel" aria-label="刪除"><svg class="i" id="ic-trash"></svg></button>
  </div>
</div>

<div class="modal dlg" id="dlg">
  <div class="box"><h3 id="dt"></h3><p id="dp"></p>
    <div class="row"><button class="btn" id="dn">取消</button><button class="btn danger" id="dy">確定刪除</button></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var P={cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',add:'<path d="M12 5v14M5 12h14"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',img:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',min:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M8 11h6"/>',max:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/>',rot:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',rst:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',zoom:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',ck:'<path d="M20 6 9 17l-5-5"/>'};
function ic(n){return '<svg class="i" viewBox="0 0 24 24">'+P[n]+'</svg>'}
document.querySelectorAll('svg.i[id^="ic-"]').forEach(function(s){s.setAttribute('viewBox','0 0 24 24');s.innerHTML=P[s.id.slice(3)]});
var $=function(i){return document.getElementById(i)};

/* ---------- 日期 ---------- */
var W=['日','一','二','三','四','五','六'];
function two(n){return n<10?'0'+n:''+n}
function dkey(d){return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
function head(){var n=new Date();$('date').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 星期'+W[n.getDay()];$('week').textContent=['新的一天，加油！','','','','','',''][0]}
head();

/* ---------- 提示及確認 ---------- */
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1800)}
var yes=null;
function ask(title,text,fn){$('dt').textContent=title;$('dp').textContent=text;yes=fn;$('dlg').classList.add('on')}
$('dn').onclick=function(){$('dlg').classList.remove('on');yes=null};
$('dy').onclick=function(){$('dlg').classList.remove('on');var f=yes;yes=null;if(f)f()};

/* ---------- IndexedDB（課程表圖片）---------- */
var dbp=new Promise(function(res,rej){
  try{var r=indexedDB.open('planner-db',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}});
function idb(mode,fn){return dbp.then(function(db){return new Promise(function(res,rej){
  var tx=db.transaction('kv',mode),q=fn(tx.objectStore('kv'));
  tx.oncomplete=function(){res(q&&q.result)};tx.onerror=function(){rej(tx.error)}})})}
var imgURL=null;
function showTT(blob){
  if(imgURL){URL.revokeObjectURL(imgURL);imgURL=null}
  var el=$('tt');
  if(!blob){
    el.innerHTML='<button class="upload" id="up" style="width:100%"><span class="big">'+ic('cam')+'</span><b>上傳課程表相片</b><span>拍照或從相簿選取，之後可放大查看</span></button>';
    $('up').onclick=pick;return}
  imgURL=URL.createObjectURL(blob);
  el.innerHTML='<div class="thumb" id="th"><img src="'+imgURL+'" alt="課程表"><span class="hint">'+ic('zoom')+'點擊全螢幕查看</span></div>'+
  '<div class="row"><button class="btn main" id="open">'+ic('zoom')+'全螢幕查看</button><button class="btn" id="rep">'+ic('img')+'更換相片</button><button class="btn danger" id="rm">'+ic('trash')+'刪除</button></div>';
  $('th').onclick=$('open').onclick=openV;$('rep').onclick=pick;$('rm').onclick=delTT;
}
function pick(){$('file').value='';$('file').click()}
$('file').onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;
  idb('readwrite',function(s){return s.put(f,'timetable')}).then(function(){showTT(f);if($('viewer').classList.contains('on')){$('vimg').src=imgURL;resetV()}toast('課程表已儲存')})
  .catch(function(){toast('儲存失敗，請再試一次')});
};
function delTT(){ask('刪除課程表？','刪除後需要重新上傳相片。',function(){
  idb('readwrite',function(s){return s.delete('timetable')}).then(function(){closeV();showTT(null);toast('已刪除課程表')})})}
idb('readonly',function(s){return s.get('timetable')}).then(showTT).catch(function(){showTT(null)});

/* ---------- 全螢幕查看：縮放、拖曳、旋轉 ---------- */
var v={x:0,y:0,s:1,r:0},st=$('stage'),im=$('vimg'),ptr=new Map(),last=null;
function apply(){im.style.transform='translate('+v.x+'px,'+v.y+'px) scale('+v.s+') rotate('+v.r+'deg)';$('zl').textContent=Math.round(v.s*100)+'%'}
function resetV(){v={x:0,y:0,s:1,r:0};apply()}
function zoomAt(f,px,py){var ns=Math.min(10,Math.max(.5,v.s*f));f=ns/v.s;
  var b=st.getBoundingClientRect(),cx=px-b.left-b.width/2,cy=py-b.top-b.height/2;
  v.x=cx-(cx-v.x)*f;v.y=cy-(cy-v.y)*f;v.s=ns;apply()}
function ctr(){var b=st.getBoundingClientRect();return[b.left+b.width/2,b.top+b.height/2]}
function openV(){im.src=imgURL;resetV();$('viewer').classList.add('on');document.body.style.overflow='hidden'}
function closeV(){$('viewer').classList.remove('on');document.body.style.overflow=''}
$('vclose').onclick=closeV;
$('vrep').onclick=pick;
$('vdel').onclick=delTT;
$('zi').onclick=function(){var c=ctr();zoomAt(1.4,c[0],c[1])};
$('zo').onclick=function(){var c=ctr();zoomAt(1/1.4,c[0],c[1])};
$('rot').onclick=function(){v.r=(v.r+90)%360;apply()};
$('rst').onclick=resetV;
st.addEventListener('wheel',function(e){e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
st.addEventListener('dblclick',function(e){if(v.s>1.05)resetV();else zoomAt(2.5,e.clientX,e.clientY)});
function pinfo(){var a=Array.from(ptr.values()),dx=a[0].x-a[1].x,dy=a[0].y-a[1].y;return{d:Math.hypot(dx,dy),x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}
st.addEventListener('pointerdown',function(e){st.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});st.classList.add('drag');last=ptr.size===2?pinfo():null});
st.addEventListener('pointermove',function(e){
  if(!ptr.has(e.pointerId))return;
  var o=ptr.get(e.pointerId),dx=e.clientX-o.x,dy=e.clientY-o.y;
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===1){v.x+=dx;v.y+=dy;apply()}
  else if(ptr.size===2){var p=pinfo();if(last){v.x+=p.x-last.x;v.y+=p.y-last.y;zoomAt(p.d/last.d,p.x,p.y)}last=p}
});
function up(e){ptr.delete(e.pointerId);last=ptr.size===2?pinfo():null;if(!ptr.size)st.classList.remove('drag')}
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('viewer').classList.contains('on'))closeV()});

/* ---------- 備忘錄 ---------- */
var TAGS=[{id:'hw',n:'功課作業',c:'#3d5afe'},{id:'ex',n:'考試測驗',c:'#e5484d'},{id:'me',n:'個人行程',c:'#12a594'},{id:'td',n:'待辦事項',c:'#e8912d'}];
var PN={h:'高',m:'中',l:'低'};
$('tags').innerHTML=TAGS.map(function(t,i){return '<label class="chip" style="--c:'+t.c+'"><input type="radio" name="tag" value="'+t.id+'"'+(i?'':' checked')+'><span>'+t.n+'</span></label>'}).join('');
var tasks=[],filter='all';
try{tasks=JSON.parse(localStorage.getItem('planner-tasks')||'[]')}catch(e){tasks=[]}
function save(){try{localStorage.setItem('planner-tasks',JSON.stringify(tasks))}catch(e){toast('無法儲存資料')}}
function defWhen(){var d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);return dkey(d)+'T'+two(d.getHours())+':'+two(d.getMinutes())}
$('when').value=defWhen();
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
$('add').onclick=function(){
  var t=$('title').value.trim(),w=$('when').value;
  if(!w){toast('請選擇日期及時間');return}
  if(!t){toast('請輸入事項名稱');$('title').focus();return}
  tasks.push({id:Date.now()+''+Math.floor(Math.random()*999),when:w,title:t,tag:document.querySelector('input[name=tag]:checked').value,p:document.querySelector('input[name=p]:checked').value,note:$('note').value.trim(),done:false});
  save();$('title').value='';$('note').value='';render();toast('已加入備忘錄')};
$('title').addEventListener('keydown',function(e){if(e.key==='Enter')$('add').click()});
$('tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;filter=b.dataset.f;
  Array.prototype.forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});render()};
function dayLabel(k){var n=new Date(),t=dkey(n),y=new Date(n.getTime()+864e5),p=k.split('-'),d=new Date(+p[0],p[1]-1,+p[2]);
  var base=(+p[1])+'月'+(+p[2])+'日 星期'+W[d.getDay()];
  return k===t?'今天 · '+base:k===dkey(y)?'明天 · '+base:base}
function render(){
  var today=dkey(new Date()),pend=tasks.filter(function(t){return!t.done}).length;
  $('sum').textContent=pend?'待辦 '+pend+' 項':'全部完成';
  var l=tasks.slice().sort(function(a,b){return a.when<b.when?-1:a.when>b.when?1:0});
  if(filter==='pending')l=l.filter(function(t){return!t.done&&t.when.slice(0,10)<=today});
  if(filter==='done')l=l.filter(function(t){return t.done});
  if(!l.length){$('list').innerHTML='<div class="empty">'+(filter==='done'?'還沒有已完成的事項':filter==='pending'?'今天沒有未完成的事項，真棒！':'還沒有事項，在上方新增第一項吧')+'</div>';return}
  var h='',cur='';
  l.forEach(function(t){
    var k=t.when.slice(0,10);
    if(k!==cur){cur=k;h+='<div class="day'+(k===today?' today':'')+'">'+dayLabel(k)+'</div>'}
    var g=TAGS.filter(function(x){return x.id===t.tag})[0]||TAGS[0],late=!t.done&&t.when<(today+'T'+two(new Date().getHours())+':'+two(new Date().getMinutes()));
    h+='<div class="item'+(t.done?' done':'')+'" style="--c:'+g.c+'"><button class="ck" data-a="t" data-id="'+t.id+'" aria-label="切換完成狀態">'+ic('ck')+'</button>'+
    '<div class="body"><div class="t">'+esc(t.title)+'</div><div class="meta"><span>'+t.when.slice(11,16)+'</span><span class="tg">'+g.n+'</span><span class="pr '+t.p+'">'+PN[t.p]+'優先</span>'+(late?'<span class="od">已逾期</span>':'')+'</div>'+
    (t.note?'<div class="note">'+esc(t.note)+'</div>':'')+'</div><button class="del" data-a="d" data-id="'+t.id+'" aria-label="刪除">'+ic('trash')+'</button></div>'});
  $('list').innerHTML=h}
$('list').onclick=function(e){var b=e.target.closest('button[data-a]');if(!b)return;var id=b.dataset.id;
  if(b.dataset.a==='t'){tasks.forEach(function(t){if(t.id===id)t.done=!t.done});save();render()}
  else ask('刪除這個事項？','刪除後無法復原。',function(){tasks=tasks.filter(function(t){return t.id!==id});save();render();toast('已刪除')})};
render();
document.addEventListener('visibilitychange',function(){if(!document.hidden){head();render()}});
})();
</script>
</body>
</html>
